<div
  class="relative h-screen w-screen overflow-hidden font-sans bg-[radial-gradient(ellipse_at_top_left,#ffe4ec_0%,transparent_50%),radial-gradient(ellipse_at_bottom_right,#d4b8e9_0%,transparent_55%),linear-gradient(135deg,#ffd1dc_0%,#fcb6cc_50%,#e9c5e8_100%)]"
>
  <!-- Soft glow blobs -->
  <div class="pointer-events-none absolute -top-24 -left-24 h-85 w-85 rounded-full bg-pink-300/60 blur-[70px] animate-drift"></div>
  <div class="pointer-events-none absolute -bottom-20 -right-20 h-75 w-75 rounded-full bg-pink-200/60 blur-[70px] animate-drift [animation-delay:-7s]"></div>
  <div class="pointer-events-none absolute top-[30%] right-[12%] h-55 w-55 rounded-full bg-purple-200/60 blur-[70px] animate-drift [animation-delay:-12s]"></div>
  <div class="pointer-events-none absolute bottom-[20%] left-[8%] h-45 w-45 rounded-full bg-orange-200/60 blur-[70px] animate-drift [animation-delay:-4s]"></div>

  <!-- Twinkling sparkles -->
  <span class="pointer-events-none absolute top-[12%] left-[18%] text-base text-white animate-twinkle [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]">✦</span>
  <span class="pointer-events-none absolute top-[22%] right-[16%] text-sm text-white animate-twinkle [animation-delay:0.8s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]">✧</span>
  <span class="pointer-events-none absolute top-[48%] left-[8%] text-xs text-white animate-twinkle [animation-delay:1.6s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]">✦</span>
  <span class="pointer-events-none absolute top-[62%] right-[10%] text-base text-white animate-twinkle [animation-delay:2.2s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]">✧</span>
  <span class="pointer-events-none absolute top-[80%] left-[28%] text-sm text-white animate-twinkle [animation-delay:0.4s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]">✦</span>
  <span class="pointer-events-none absolute top-[8%] left-[52%] text-sm text-white animate-twinkle [animation-delay:1.2s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]">✧</span>

  <!-- Rising hearts -->
  <span class="pointer-events-none absolute -bottom-10 left-[8%] text-2xl text-pink-500/90 opacity-0 animate-rise filter-[drop-shadow(0_0_8px_rgba(255,107,157,0.4))]">♥</span>
  <span class="pointer-events-none absolute -bottom-10 left-[22%] text-base text-pink-500/90 opacity-0 animate-rise [animation-delay:2.5s] filter-[drop-shadow(0_0_8px_rgba(255,107,157,0.4))]">♥</span>
  <span class="pointer-events-none absolute -bottom-10 left-[38%] text-3xl text-pink-500/90 opacity-0 animate-rise [animation-delay:4.2s] filter-[drop-shadow(0_0_8px_rgba(255,107,157,0.4))]">♡</span>
  <span class="pointer-events-none absolute -bottom-10 left-[58%] text-xl text-pink-500/90 opacity-0 animate-rise [animation-delay:1.1s] filter-[drop-shadow(0_0_8px_rgba(255,107,157,0.4))]">♥</span>
  <span class="pointer-events-none absolute -bottom-10 left-[72%] text-lg text-pink-500/90 opacity-0 animate-rise [animation-delay:3.6s] filter-[drop-shadow(0_0_8px_rgba(255,107,157,0.4))]">♡</span>
  <span class="pointer-events-none absolute -bottom-10 left-[86%] text-2xl text-pink-500/90 opacity-0 animate-rise [animation-delay:5.2s] filter-[drop-shadow(0_0_8px_rgba(255,107,157,0.4))]">♥</span>

  <!-- Stage -->
  <div class="relative z-10 flex h-full items-center justify-center p-4">
    <div
      class="flex flex-col items-center transition-transform duration-2400 ease-[cubic-bezier(0.22,1,0.36,1)]"
      [class.-translate-y-[130vh]]="isFloating"
    >
      <!-- Balloon cluster -->
      <div class="flex items-end gap-1.5 -mb-1">
        <img src="assets/balloon3.png" alt="balloon"
             class="w-14 origin-bottom animate-bob filter-[drop-shadow(0_8px_16px_rgba(255,105,160,0.35))]" />
        <img src="assets/balloon3.png" alt="balloon"
             class="w-16 -translate-y-3 origin-bottom animate-bob [animation-delay:-1.5s] filter-[drop-shadow(0_8px_16px_rgba(255,105,160,0.35))]" />
        <img src="assets/balloon3.png" alt="balloon"
             class="w-14 origin-bottom animate-bob [animation-delay:-2.7s] filter-[drop-shadow(0_8px_16px_rgba(255,105,160,0.35))]" />
      </div>

      <!-- String -->
      <div class="mt-1 h-14 w-px bg-linear-to-b from-pink-900/55 to-transparent"></div>

      <!-- ⭐ GLASS CARD — refreshed with love-letter aesthetic ⭐ -->
      <div
        class="relative w-105 max-w-[92vw] rounded-3xl border border-white/65 px-10 pt-14 pb-7 text-center
               bg-[linear-gradient(135deg,rgba(255,255,255,0.65)_0%,rgba(255,228,238,0.35)_100%)]
               backdrop-blur-2xl backdrop-saturate-150
               shadow-[0_24px_60px_-12px_rgba(220,100,150,0.30),inset_0_0_0_1px_rgba(255,182,193,0.30),inset_0_1px_0_rgba(255,255,255,0.85)]"
      >
        <!-- 🎀 Decorative ribbon at top -->
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-20">
          <div class="px-5 py-1.5 rounded-full border border-white/40 shadow-md
                      bg-linear-to-r from-[#d4a574] via-[#e8c39a] to-[#d4a574]
                      text-[10px] font-semibold uppercase tracking-[3px] text-white">
            <span class="opacity-90">♥</span> To My Love <span class="opacity-90">♥</span>
          </div>
        </div>

        <!-- Rose-gold corners — all 4 -->
        <div class="pointer-events-none absolute top-3 left-3 h-10 w-10 rounded-tl-[18px] border-l-2 border-t-2 border-[#d4a574]/65"></div>
        <div class="pointer-events-none absolute top-3 right-3 h-10 w-10 rounded-tr-[18px] border-r-2 border-t-2 border-[#d4a574]/65"></div>
        <div class="pointer-events-none absolute bottom-3 left-3 h-10 w-10 rounded-bl-[18px] border-l-2 border-b-2 border-[#d4a574]/65"></div>
        <div class="pointer-events-none absolute bottom-3 right-3 h-10 w-10 rounded-br-[18px] border-r-2 border-b-2 border-[#d4a574]/65"></div>

        <!-- Title -->
        <h1 class="font-['Great_Vibes',cursive] text-[56px] leading-none text-[#c44569] tracking-wide
                   [text-shadow:0_2px_12px_rgba(255,182,193,0.7)]">
          Happy Birthday
        </h1>

        <!-- 🌸 Decorative divider -->
        <div class="flex items-center justify-center gap-3 mt-3 mb-2">
          <span class="h-px w-14 bg-linear-to-r from-transparent to-[#d4a574]/55"></span>
          <span class="text-[#d4a574] text-base">❦</span>
          <span class="h-px w-14 bg-linear-to-l from-transparent to-[#d4a574]/55"></span>
        </div>

        <!-- "my love" subtitle -->
        <div class="font-['Great_Vibes',cursive] mb-4 text-[28px] text-[#d4a574]
                    [text-shadow:0_1px_6px_rgba(212,165,116,0.4)]">
          my love
        </div>

        <!-- Thai message -->
        <p class="mb-7 font-['Cormorant_Garamond',serif] text-[16px] italic leading-relaxed text-[#8e3d5b]">
          <span class="mx-1.5 text-xs text-pink-500">♥</span>
          สุขสันต์วันเกิดนะคนสวยของผม
          <span class="mx-1.5 text-xs text-pink-500">♥</span>
        </p>

        <!-- Form -->
        <div class="flex flex-col gap-3">
          <div class="relative">
            <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg">🎂</span>
            <input
              type="text"
              name="date"
              id="date"
              placeholder="กรุณาใส่วันเกิดค่ะ"
              [(ngModel)]="birthdayCode"
              class="w-full rounded-2xl border-[1.5px] border-[#d4a574]/35 bg-white/75 px-5 py-3.5 pl-11
                     text-center text-[14.5px] text-[#5a2540] placeholder-[#b8859a]
                     outline-none transition-all
                     focus:bg-white/95 focus:border-[#d4a574] focus:ring-4 focus:ring-[#d4a574]/20"
            />
          </div>

          <button
            (click)="onClick()"
            class="relative overflow-hidden rounded-2xl border-0 px-7 py-3.5
                   text-sm font-semibold uppercase tracking-[2px] text-white
                   bg-linear-to-br from-[#ff8fab] via-[#ff6b9d] to-[#c44569]
                   shadow-[0_10px_24px_-6px_rgba(196,69,105,0.55),inset_0_1px_0_rgba(255,255,255,0.4)]
                   transition-all duration-200
                   hover:-translate-y-0.5 hover:shadow-[0_14px_32px_-6px_rgba(196,69,105,0.65),inset_0_1px_0_rgba(255,255,255,0.5)]
                   active:translate-y-0 active:scale-[0.98]"
          >
            <span class="relative z-10 inline-flex items-center justify-center gap-2">
              <span class="text-pink-100">♥</span>
              <span>Let's Go</span>
              <span class="text-pink-100">✨</span>
            </span>
            <span class="absolute inset-0 animate-shimmer bg-[linear-gradient(110deg,transparent_30%,rgba(255,255,255,0.45)_50%,transparent_70%)]"></span>
          </button>
        </div>

        <!-- ✍️ Bottom signature line -->
        <div class="mt-6 flex items-center justify-center gap-3">
          <span class="h-px w-10 bg-[#8e3d5b]/25"></span>
          <p class="font-['Cormorant_Garamond',serif] text-[11px] italic tracking-[2px] uppercase text-[#8e3d5b]/55">
            with all my love
          </p>
          <span class="h-px w-10 bg-[#8e3d5b]/25"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="absolute bottom-5 left-1/2 z-5 -translate-x-1/2 font-['Cormorant_Garamond',serif] text-xs italic tracking-wide text-[#8c3c5a]/55">
    made with ♥ just for you
  </div>
</div>
