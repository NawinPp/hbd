<div
  #bg
  class="relative h-screen w-screen overflow-hidden font-sans bg-[radial-gradient(ellipse_at_top_left,#ffe4ec_0%,transparent_50%),radial-gradient(ellipse_at_bottom_right,#d4b8e9_0%,transparent_55%),linear-gradient(135deg,#ffd1dc_0%,#fcb6cc_50%,#e9c5e8_100%)]"
>
  <!-- Background blobs -->
  <div
    class="pointer-events-none absolute -top-24 -left-24 h-85 w-85 rounded-full bg-pink-300/60 blur-[70px] animate-drift"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-20 -right-20 h-75 w-75 rounded-full bg-pink-200/60 blur-[70px] animate-drift [animation-delay:-7s]"
  ></div>
  <div
    class="pointer-events-none absolute top-[30%] right-[12%] h-55 w-55 rounded-full bg-purple-200/60 blur-[70px] animate-drift [animation-delay:-12s]"
  ></div>
  <div
    class="pointer-events-none absolute bottom-[20%] left-[8%] h-45 w-45 rounded-full bg-orange-200/60 blur-[70px] animate-drift [animation-delay:-4s]"
  ></div>

  <!-- Sparkles -->
  <span
    class="pointer-events-none absolute top-[12%] left-[18%] text-base text-white animate-twinkle [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]"
    >✦</span
  >
  <span
    class="pointer-events-none absolute top-[22%] right-[16%] text-sm text-white animate-twinkle [animation-delay:0.8s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]"
    >✧</span
  >
  <span
    class="pointer-events-none absolute top-[48%] left-[8%] text-xs text-white animate-twinkle [animation-delay:1.6s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]"
    >✦</span
  >
  <span
    class="pointer-events-none absolute top-[8%] left-[52%] text-sm text-white animate-twinkle [animation-delay:1.2s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]"
    >✧</span
  >
  <span
    class="pointer-events-none absolute top-[72%] right-[32%] text-xs text-white animate-twinkle [animation-delay:2.8s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]"
    >✦</span
  >
  <span
    class="pointer-events-none absolute top-[35%] left-[88%] text-sm text-white animate-twinkle [animation-delay:1.9s] [text-shadow:0_0_8px_#fff,0_0_18px_rgba(255,215,240,0.85)]"
    >✧</span
  >

  <!-- ============ ฉาก 1: เค้ก ============ -->
  <div
    *ngIf="!showWish"
    class="relative z-10 flex h-full flex-col items-center justify-center gap-8 p-4"
  >
    <!-- "Make a wish" -->
    <div
      class="font-['Great_Vibes',cursive] text-5xl text-[#c44569] [text-shadow:0_2px_12px_rgba(255,182,193,0.7)]"
    >
      Make a wish
    </div>

    <!-- 🎂 Cake -->
    <div
      class="relative animate-bob filter-[drop-shadow(0_25px_30px_rgba(220,100,150,0.35))]"
    >
      <div class="relative h-64 w-56">
        <!-- Candle glow (blur halo) -->
        <div
          class="pointer-events-none absolute bottom-48.75 left-1/2 -translate-x-1/2 h-20 w-20 rounded-full bg-yellow-300/60 blur-2xl animate-candle-glow"
        ></div>

        <!-- Flame sparkles -->
        <span
          class="absolute bottom-56.25 left-[45%] text-xs text-yellow-100 animate-twinkle [text-shadow:0_0_6px_#fff]"
          >✦</span
        >
        <span
          class="absolute bottom-53.75 left-[58%] text-[10px] text-yellow-100 animate-twinkle [animation-delay:0.6s] [text-shadow:0_0_6px_#fff]"
          >✧</span
        >

        <!-- Flame -->
        <div
          class="absolute bottom-50 left-1/2 h-5 w-3 rounded-full animate-flicker bg-linear-to-t from-orange-500 via-yellow-300 to-yellow-50 [box-shadow:0_0_15px_rgba(255,180,80,0.9),0_0_30px_rgba(255,200,100,0.5)]"
        ></div>

        <!-- Wick -->
        <div
          class="absolute bottom-49.25 left-1/2 -translate-x-1/2 h-1.5 w-px bg-stone-800"
        ></div>

        <!-- Candle -->
        <div
          class="absolute bottom-36.25 left-1/2 -translate-x-1/2 h-14 w-2.5 rounded-sm bg-linear-to-b from-rose-200 via-rose-400 to-rose-600 shadow-[inset_-2px_0_3px_rgba(0,0,0,0.15),inset_2px_0_3px_rgba(255,255,255,0.3)]"
        >
          <!-- Candle stripes -->
          <div class="absolute top-2 inset-x-0 h-px bg-white/30"></div>
          <div class="absolute top-5 inset-x-0 h-px bg-white/30"></div>
          <div class="absolute top-8 inset-x-0 h-px bg-white/30"></div>
        </div>

        <!-- Top frosting + drips -->
        <div class="absolute bottom-30 left-1/2 -translate-x-1/2 w-44">
          <div
            class="h-7 w-full rounded-full bg-linear-to-b from-white to-pink-50 shadow-md"
          ></div>
          <!-- Drips hanging down -->
          <div
            class="absolute -bottom-1 left-1 w-3 h-5 rounded-b-full bg-white"
          ></div>
          <div
            class="absolute -bottom-1 left-6 w-3.5 h-9 rounded-b-full bg-white"
          ></div>
          <div
            class="absolute -bottom-1 left-12 w-3 h-4 rounded-b-full bg-pink-50"
          ></div>
          <div
            class="absolute -bottom-1 left-20 w-4 h-10 rounded-b-full bg-white"
          ></div>
          <div
            class="absolute -bottom-1 left-28 w-3 h-5 rounded-b-full bg-white"
          ></div>
          <div
            class="absolute -bottom-1 right-8 w-3.5 h-8 rounded-b-full bg-white"
          ></div>
          <div
            class="absolute -bottom-1 right-1 w-3 h-6 rounded-b-full bg-pink-50"
          ></div>
        </div>

        <!-- Cake body -->
        <div
          class="absolute bottom-2 left-1/2 -translate-x-1/2 h-32 w-44 rounded-b-2xl bg-linear-to-b from-pink-400 via-pink-500 to-pink-600 shadow-[inset_0_-8px_15px_rgba(120,30,70,0.2)]"
        >
          <!-- Decorative dots -->
          <div
            class="absolute top-9 left-4 h-2 w-2 rounded-full bg-rose-700/40"
          ></div>
          <div
            class="absolute top-12 left-12 h-1.5 w-1.5 rounded-full bg-white/80"
          ></div>
          <div
            class="absolute top-16 left-1/2 -translate-x-1/2 h-2 w-2 rounded-full bg-rose-700/40"
          ></div>
          <div
            class="absolute top-10 right-6 h-1.5 w-1.5 rounded-full bg-white/80"
          ></div>
          <div
            class="absolute bottom-6 left-8 h-1.5 w-1.5 rounded-full bg-white/80"
          ></div>
          <div
            class="absolute bottom-8 right-10 h-2 w-2 rounded-full bg-rose-700/40"
          ></div>
        </div>

        <!-- Plate -->
        <div
          class="absolute bottom-0 left-1/2 -translate-x-1/2 h-3 w-56 rounded-full bg-linear-to-b from-rose-100 to-rose-300 shadow-lg"
        ></div>
      </div>
    </div>

    <!-- Button -->
    <button
      (click)="showText()"
      class="relative overflow-hidden rounded-2xl border-0 px-8 py-3.5 text-sm font-semibold uppercase tracking-[2px] text-white bg-linear-to-br from-[#ff8fab] via-[#ff6b9d] to-[#c44569] shadow-[0_10px_24px_-6px_rgba(196,69,105,0.55),inset_0_1px_0_rgba(255,255,255,0.4)] transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_14px_32px_-6px_rgba(196,69,105,0.65)] active:translate-y-0 active:scale-[0.98]"
    >
      <span class="relative z-10 inline-flex items-center gap-2">
        <span class="text-pink-100">💨</span>
        <span>ไปกันต่อ</span>
        <span class="text-pink-100">✨</span>
      </span>
      <span
        class="absolute inset-0 animate-shimmer bg-[linear-gradient(110deg,transparent_30%,rgba(255,255,255,0.45)_50%,transparent_70%)]"
      ></span>
    </button>
  </div>

  <!-- ============ ฉาก 2: คำอวยพร ============ -->
  <div
    *ngIf="showWish"
    class="relative z-10 flex min-h-full flex-col items-center justify-center gap-8 p-6"
  >
    <div
      class="relative w-160 max-w-[92vw] rounded-3xl border border-white/65 px-10 py-12 text-center bg-[linear-gradient(135deg,rgba(255,255,255,0.65)_0%,rgba(255,228,238,0.35)_100%)] backdrop-blur-2xl backdrop-saturate-150 shadow-[0_24px_60px_-12px_rgba(220,100,150,0.30),inset_0_0_0_1px_rgba(255,182,193,0.30),inset_0_1px_0_rgba(255,255,255,0.85)]"
    >
      <!-- Corner accents -->
      <div
        class="pointer-events-none absolute top-3 left-3 h-10 w-10 rounded-tl-[18px] border-l-2 border-t-2 border-[#d4a574]/65"
      ></div>
      <div
        class="pointer-events-none absolute top-3 right-3 h-10 w-10 rounded-tr-[18px] border-r-2 border-t-2 border-[#d4a574]/65"
      ></div>
      <div
        class="pointer-events-none absolute bottom-3 left-3 h-10 w-10 rounded-bl-[18px] border-l-2 border-b-2 border-[#d4a574]/65"
      ></div>
      <div
        class="pointer-events-none absolute bottom-3 right-3 h-10 w-10 rounded-br-[18px] border-r-2 border-b-2 border-[#d4a574]/65"
      ></div>

      <!-- Animated title (ตัวอักษรเด้งทีละตัว) -->
      <div class="mb-2 flex flex-wrap items-baseline justify-center">
        <h1
          *ngFor="let char of birthdayText; let i = index"
          [style.animationDelay]="i * 0.1 + 's'"
          class="font-['Great_Vibes',cursive] text-7xl text-[#c44569] inline-block opacity-0 animate-letter-pop [text-shadow:0_2px_12px_rgba(255,182,193,0.7)]"
          [class.w-4]="char === ' '"
        >
          {{ char === " " ? "" : char }}
        </h1>
      </div>

      <!-- Decorative divider -->
      <div class="my-5 flex items-center justify-center gap-3">
        <span
          class="h-px w-16 bg-linear-to-r from-transparent to-[#d4a574]/55"
        ></span>
        <span class="text-base text-[#d4a574]">❦</span>
        <span
          class="h-px w-16 bg-linear-to-l from-transparent to-[#d4a574]/55"
        ></span>
      </div>

      <!-- Wish message -->
      <p
        class="font-['Cormorant_Garamond',serif] whitespace-pre-line text-[17px] italic leading-[1.9] text-[#8e3d5b] opacity-0 transition-opacity duration-1000"
        [class.opacity-100]="showParagraph"
      >
        {{ wishMessage }}
      </p>

      <!-- Signature -->
      <div
        class="mt-8 flex items-center justify-center gap-3 opacity-0 transition-opacity duration-1500"
        [class.opacity-100]="showParagraph"
      >
        <span class="h-px w-10 bg-[#8e3d5b]/25"></span>
        <p
          class="font-['Cormorant_Garamond',serif] text-[11px] italic uppercase tracking-[2px] text-[#8e3d5b]/55"
        >
          with all my love
        </p>
        <span class="h-px w-10 bg-[#8e3d5b]/25"></span>
      </div>
    </div>

    <button
      (click)="goto()"
      class="relative overflow-hidden rounded-2xl border-0 px-8 py-3.5 text-sm font-semibold uppercase tracking-[2px] text-white bg-linear-to-br from-[#ff8fab] via-[#ff6b9d] to-[#c44569] shadow-[0_10px_24px_-6px_rgba(196,69,105,0.55),inset_0_1px_0_rgba(255,255,255,0.4)] transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_14px_32px_-6px_rgba(196,69,105,0.65)] active:translate-y-0 active:scale-[0.98]"
    >
      <span class="relative z-10 inline-flex items-center gap-2">
        <span class="text-pink-100">📸</span>
        <span>ไปดูรูปดีกว่า</span>
        <span class="text-pink-100">♥</span>
      </span>
      <span
        class="absolute inset-0 animate-shimmer bg-[linear-gradient(110deg,transparent_30%,rgba(255,255,255,0.45)_50%,transparent_70%)]"
      ></span>
    </button>
  </div>

  <audio #happybirthday src="assets/HappyBirthday.mp3" autoplay></audio>
</div>
